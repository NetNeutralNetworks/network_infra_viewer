---
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: network-infra-viewer-pvc
  namespace: network-infra-viewer
  labels:
    app: webserver
spec:
  storageClassName: manual
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  volumeName: network-infra-viewer-pv