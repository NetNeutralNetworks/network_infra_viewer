<script type="text/javascript">

var stringToColour = function(str) {
      var hash = 0;
      for (var i = 0; i < str.length; i++) {
              hash = str.charCodeAt(i) + ((hash << 5) - hash);
      }
      var colour = '#';
      for (var i = 0; i < 3; i++) {
              var value = (hash >> (i * 8)) & 0xFF;
              colour += ('00' + value.toString(16)).substr(-2);
      }
      return colour;
}

async function getapi(url, type) {
  
  // Storing response
  const response = await fetch(url);
  
  // Storing data in form of JSON
  var data = await response.json();
  console.log(data);
  if(type=='line'){
        show_DFC(data);
  }else if(type == 'node'){
        show_Location(data);
  }
  return data
}
var map = L.map('map').setView([52.2, 5.4], 7);

var tiles = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
}).addTo(map);

var marker_group = L.markerClusterGroup();

fetch('/api/locations/v1/list')
        .then(response => response.json())
        .then(markers => {
                for (var i = 0; i < markers.length; i++) {
                        var marker = L.marker([markers[i].latitude, markers[i].longtitude]);
                        marker.location = markers[i].name
                        marker_group.addLayer(marker)
                        var popup_content = '<div class="popup-header">'+ markers[i].name +'</div>\
                        <div id="popup-content">\
                                item 1\
                        </div>\
                        '
                        marker.bindPopup(popup_content);
                        marker.on('popupopen', function(e){
                                console.log(e.popup._source.location)
                                fetch("/mapoverview/location/?location=" + e.popup._source.location)
                                .then(response => response.json())
                                .then(devices => {
                                        var content = ""
                                        for (var i = 0; i < devices.length; i++) {
                                                content += '<div class="popup-content">'+ devices[i] + '</div>'
                                        }
                                        document.getElementById("popup-content").innerHTML = content;
                                })

                        });
                }
                map.addLayer(marker_group)
        })

fetch('/api/spans/v1/list')
        .then(response => response.json())
        .then(spans => {
                for (var i = 0; i < spans.length; i++) {
                        var cable_color = '#CA005D'
                        // var cable_color = '#b8bfb2'
                        if (spans[i].capacity <= 4 ){
                                opacity = 0.4
                                // cable_color = '#301cfa'
                        }else if (spans[i].capacity <= 8){
                                opacity = 0.5
                                // cable_color = '#1ce2fa'
                        }
                        else if (spans[i].capacity <= 16){
                                opacity = 0.6
                                // cable_color = '#1cfa7a'
                        }
                        else if (spans[i].capacity <= 32){
                                opacity = 0.7
                                // cable_color = '#7efa1c'
                        }
                        else if (spans[i].capacity <= 64){
                                opacity = 0.8
                                // cable_color = '#e9fa1c'
                        }
                        else if (spans[i].capacity <= 128){
                                opacity = 0.9
                                // cable_color = '#faa61c'
                        }
                        else if (spans[i].capacity > 128){
                                opacity = 1
                                // cable_color = '#fa371c'
                        }
                        var line = L.polyline(spans[i].coords, {
                                weight: 5,
                                color : cable_color,
                                opacity: opacity
                        });
                        line.on('mouseover', function() {
                                this.setStyle({
                                        weight: 15,   //or whatever style you wish to use;
                                });
                        });
                        line.on('mouseout', function() {
                                this.setStyle({
                                        weight: 5
                                })
                                this.bringToBack()
                        });
                        line.span = spans[i].spanid
                        marker_group.addLayer(line)
                        line.bindPopup("<a href='/mapoverview/span/?span=" + spans[i].spanid + "'>" + spans[i].spanid + "</a><table id='current_popup' style='width: 600px'></table>",{
                                maxWidth : 560
                        });
                        line.on('popupopen', function(e){
                                console.log(e.popup._source.span)
                                getapi("/mapoverview/span/?span=" + e.popup._source.span, 'line')

                        });
                }
                map.addLayer(marker_group)
        })
</script>
